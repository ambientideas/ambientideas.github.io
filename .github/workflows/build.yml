name: Build

on:
  # Pushes to master are covered by deploy.yml, which runs the same
  # `rake test` before publishing. This workflow now guards pull requests.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Builds with the same Jekyll deploy.yml publishes with, then checks
      # internal links and images on the hand-maintained pages.
      - run: bundle exec rake test
